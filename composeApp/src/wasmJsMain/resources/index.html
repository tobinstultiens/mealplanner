<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7fbf1" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#10140f" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Meal planner</title>
    <style>
        /* The page's colour until the app has drawn itself: the device's, or the choice made in Settings (see the script below). */
        :root { --page: #f7fbf1; --ink: #191d17; }
        @media (prefers-color-scheme: dark) { :root { --page: #10140f; --ink: #e1e4d9; } }
        :root[data-theme="light"] { --page: #f7fbf1; --ink: #191d17; }
        :root[data-theme="dark"] { --page: #10140f; --ink: #e1e4d9; }
        html, body { height: 100%; margin: 0; background: var(--page); }
    </style>
    <script>
        // The app keeps the Light/Dark choice in localStorage under "theme" (SettingsStorage.themeMode) as
        // LIGHT, DARK or SYSTEM, and writes it as soon as it changes, so this reads the current one.
        try {
            var theme = localStorage.getItem("theme");
            if (theme === "LIGHT" || theme === "DARK") {
                theme = theme.toLowerCase();
                document.documentElement.dataset.theme = theme;
                // Browser chrome (the address bar on a phone) follows too.
                document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
                    if (meta.media.indexOf(theme) < 0) meta.remove();
                    else meta.removeAttribute("media");
                });
            }
        } catch (e) { /* storage blocked: the device's setting applies */ }
    </script>
    <script type="application/javascript" src="composeApp.js"></script>
</head>
<body></body>
</html>
