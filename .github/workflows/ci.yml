name: CI

# Five jobs run side by side; then the server image is built and started, and pushed only on main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Shared logic, server and app tests (JVM, Android host and the browser), and the migration check.
  test:
    runs-on: ubuntu-latest
    env:
      # The browser of the Wasm tests: Chrome for Testing at this version, checked against this hash, instead
      # of whatever Chrome the runner image has that week (issue 306). A new version needs both lines.
      CHROME_VERSION: 157.0.8103.78
      CHROME_SHA256: 9223832977a13db3646201b1341c1f9cf08afa3ceae92540116d7b0c062364fb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The npm packages of the Wasm build: the Kotlin plugin's tooling (webpack, Karma, Mocha) and yarn's
      # cache, keyed on what decides them, so a normal run needs no npm registry (issue 306). No restore-keys: a
      # run never starts from another lock's packages. Only this job saves them, at its end, after its browser
      # tests have used them and the tree has been checked; server-jar only restores.
      - name: Restore the npm packages of the Wasm build
        id: npm
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.kotlin/kotlin-npm-tooling
            ~/.cache/yarn
          key: wasm-npm-v2-${{ hashFiles('gradle/libs.versions.toml', 'kotlin-js-store/wasm/yarn.lock') }}
      # A restored tooling tree that lacks a package of its lock is not used: it is removed, with a warning, and
      # the build installs the packages itself, so a bad cache entry cannot decide a run.
      - name: Check the restored npm packages
        if: steps.npm.outputs.cache-hit == 'true'
        run: |
          scripts/verify-npm-tree --self-test
          for dir in ~/.kotlin/kotlin-npm-tooling/yarn/*/; do
            if ! scripts/verify-npm-tree "$dir"; then
              echo "::warning::The cached npm packages are incomplete and are not used; delete the cache entry ${{ steps.npm.outputs.cache-primary-key }}."
              rm -rf ~/.kotlin/kotlin-npm-tooling ~/.cache/yarn
              break
            fi
          done
      # The zip is kept, not the unpacked browser, so that its hash is checked on every run, cached or not.
      - name: Restore Chrome
        id: chrome
        uses: actions/cache@v4
        with:
          path: ~/chrome-for-testing-zip
          key: chrome-for-testing-zip-${{ env.CHROME_VERSION }}
      - name: Download Chrome
        if: steps.chrome.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/chrome-for-testing-zip
          url="https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
          for attempt in 1 2 3 4; do
            curl -fsSL -o ~/chrome-for-testing-zip/chrome-linux64.zip "$url" && break
            [ "$attempt" -lt 4 ] || exit 1
            echo "::warning::Chrome's download failed (attempt $attempt of 4); retrying the download in 10 s"
            sleep 10
          done
      # Karma starts the browser named by CHROME_BIN. Ubuntu forbids the user namespaces Chrome's sandbox
      # needs, so it uses its setuid helper, as the packaged Chrome does. Started once here, so a browser that
      # cannot run fails in this step and says so, not as a test failure.
      - name: Versions
        run: |
          echo "$CHROME_SHA256  $HOME/chrome-for-testing-zip/chrome-linux64.zip" | sha256sum --check
          unzip -q ~/chrome-for-testing-zip/chrome-linux64.zip -d "$RUNNER_TEMP/chrome"
          chrome=$RUNNER_TEMP/chrome/chrome-linux64/chrome
          sudo chown root:root "${chrome}_sandbox"
          sudo chmod 4755 "${chrome}_sandbox"
          echo "CHROME_DEVEL_SANDBOX=${chrome}_sandbox" >> "$GITHUB_ENV"
          export CHROME_DEVEL_SANDBOX=${chrome}_sandbox
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          echo "YARN_CACHE_FOLDER=$HOME/.cache/yarn" >> "$GITHUB_ENV"
          "$chrome" --version
          "$chrome" --headless --disable-gpu --dump-dom about:blank > /dev/null
          ./gradlew --version
      - name: Test
        run: ./gradlew :shared:allTests :server:test :server:verifyMainDatabaseMigration :composeApp:allTests --profile
      # The browser tests can fail with a bare "Error"; the reports hold what the console said.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 7
      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-test
          path: build/reports/profile/
      # No test reaches the network (issue 306): the test tasks run again, offline, in a network namespace with
      # only the loopback. The Test step above has resolved, downloaded and built everything they use, so this
      # needs nothing from outside whatever the caches held. Its daemon is stopped first (scripts/without-network).
      - name: Test again without a network
        run: |
          ./gradlew --stop
          scripts/without-network ./gradlew --offline \
            :shared:jvmTest --rerun :shared:wasmJsBrowserTest --rerun :server:test --rerun \
            :composeApp:testAndroidHostTest --rerun :composeApp:wasmJsBrowserTest --rerun
      # Only after everything above passed, only when the restore missed, and only a whole tree.
      - name: Check the npm packages before saving them
        if: steps.npm.outputs.cache-hit != 'true'
        run: for dir in ~/.kotlin/kotlin-npm-tooling/yarn/*/; do scripts/verify-npm-tree "$dir"; done
      - name: Save the npm packages of the Wasm build
        if: steps.npm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.kotlin/kotlin-npm-tooling
            ~/.cache/yarn
          key: ${{ steps.npm.outputs.cache-primary-key }}

  # The debug APK and lint. Release APKs are built by the Release workflow.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Versions
        run: ./gradlew --version
      # testDebugUnitTest starts the real MainActivity under Robolectric (AppStartTest): an app that cannot start fails here.
      - name: Build, start and lint
        run: ./gradlew :androidApp:assembleDebug :androidApp:testDebugUnitTest :androidApp:lintDebug --profile
      # As in the test job: the unit tests again, offline, with no network but the loopback (issue 306).
      - name: Test again without a network
        run: |
          ./gradlew --stop
          scripts/without-network ./gradlew --offline :androidApp:testDebugUnitTest --rerun
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-android
          path: build/reports/profile/

  # Screenshot tests: the screens rendered on the JVM (Robolectric), compared with the pictures in
  # composeApp/src/androidHostTest/screenshots. A separate job, so the test job doesn't get longer.
  # When a picture differs, the artifact holds the new picture and a reference | difference | new image.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Versions
        run: ./gradlew --version
      - name: Compare screenshots
        run: ./gradlew :composeApp:verifyScreenshots --profile
      # As in the test job: the screenshot tests again, offline, with no network but the loopback (issue 306).
      # verifyScreenshots never takes its tests as up to date, so they run again.
      - name: Compare screenshots again without a network
        run: |
          ./gradlew --stop
          scripts/without-network ./gradlew --offline :composeApp:verifyScreenshots
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-differences
          path: composeApp/build/outputs/roborazzi/
      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-screenshots
          path: build/reports/profile/

  # The server jar with the web client (Wasm production build) inside.
  server-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags: the jar says which v* tag it was built after (GET /health).
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # As in the test job: the Wasm build's npm packages without the registry, restored only (the test job saves
      # them) and checked before use. On a miss this job installs them itself and does not save them.
      - name: Restore the npm packages of the Wasm build
        id: npm
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.kotlin/kotlin-npm-tooling
            ~/.cache/yarn
          key: wasm-npm-v2-${{ hashFiles('gradle/libs.versions.toml', 'kotlin-js-store/wasm/yarn.lock') }}
      - name: Check the restored npm packages
        if: steps.npm.outputs.cache-hit == 'true'
        run: |
          for dir in ~/.kotlin/kotlin-npm-tooling/yarn/*/; do
            if ! scripts/verify-npm-tree "$dir"; then
              echo "::warning::The cached npm packages are incomplete and are not used; delete the cache entry ${{ steps.npm.outputs.cache-primary-key }}."
              rm -rf ~/.kotlin/kotlin-npm-tooling ~/.cache/yarn
              break
            fi
          done
      - name: Versions
        run: |
          echo "YARN_CACHE_FOLDER=$HOME/.cache/yarn" >> "$GITHUB_ENV"
          ./gradlew --version
      - name: Build the server jar
        run: ./gradlew :server:shadowJar --profile
      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: server/build/libs/server-all.jar
          retention-days: 3
      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-server-jar
          path: build/reports/profile/

  # The self-tests of the helper scripts for agents (scripts/agent-cost, scripts/code-map): plain Python
  # on made-up input, no Gradle, no secrets. A script that breaks fails here and not in the next session.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-tests of the agent scripts
        run: |
          scripts/agent-cost --self-test
          scripts/code-map --self-test
      # The helpers for the emulator (scripts/emulator): plain Python on made-up input; the clock shim's
      # test builds a small C library and skips itself without gcc (ubuntu-latest has it).
      - name: Self-tests of the emulator helpers
        run: |
          python3 -I scripts/emulator/screen.py --self-test
          python3 -I scripts/emulator/seed-recipes.py --self-test
          scripts/emulator/with-clock.sh --self-test
      # The registration helper that runs next to LLDAP (issue 314), against a fake LLDAP on the loopback: plain Python.
      - name: Self-test of the registration helper
        run: python3 -I scripts/test_registration_helper.py

  # The server image: built and started on every run, so what only shows at start is found before the
  # merge and not the morning after; pushed only on main. Same registry and secrets as the cooking
  # site. The homelab is amd64 only.
  image:
    needs: [test, android, screenshots, server-jar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: server/build/libs
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kick1999/mealplanner:${{ github.sha }}
      # No stores and no login provider: the server must still start and serve its health and the web client.
      - name: Start the image
        run: |
          docker run -d --name mealplanner -p 8080:8080 \
            -e MEALPLANNER_FETCH_OFFERS=off -e MEALPLANNER_DB_URL=jdbc:sqlite:/data/mealplanner.db \
            kick1999/mealplanner:${{ github.sha }}
      - name: Wait for it to report this commit
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health | tee health.json | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
              cat health.json; exit 0
            fi
            sleep 1
          done
          echo "No /health with commit ${GITHUB_SHA} within 60 seconds"
          docker logs mealplanner
          exit 1
      - name: Check the web client and the data check
        run: |
          curl -fsS http://localhost:8080/ | grep -qi "<html" || { echo "/ does not serve the web client's page"; docker logs mealplanner; exit 1; }
          curl -fsS http://localhost:8080/health/data
      - name: Stop the image
        if: always()
        run: docker rm -f mealplanner
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # The very image that was started, not a second build.
      - name: Push the image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag kick1999/mealplanner:${{ github.sha }} kick1999/mealplanner:latest
          docker push kick1999/mealplanner:${{ github.sha }}
          docker push kick1999/mealplanner:latest
