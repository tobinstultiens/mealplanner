name: CI

# Five jobs run side by side; then the server image is built and started, and pushed only on main.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Shared logic, server and app tests (JVM, Android host and the browser), and the migration check.
  test:
    runs-on: ubuntu-latest
    env:
      # The browser of the Wasm tests: Chrome for Testing at this version, checked against this hash, instead
      # of whatever Chrome the runner image has that week (issue 306). A new version needs both lines.
      CHROME_VERSION: 157.0.8103.78
      CHROME_SHA256: 9223832977a13db3646201b1341c1f9cf08afa3ceae92540116d7b0c062364fb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # The npm packages of the Wasm build: the Kotlin plugin's tooling (webpack, Karma, Mocha) and yarn's
      # cache, keyed on what decides them, so a normal run needs no npm registry (issue 306). Saved only
      # after a green job, and no restore-keys: a run never starts from another lock's packages.
      - name: Restore the npm packages of the Wasm build
        uses: actions/cache@v4
        with:
          path: |
            ~/.kotlin/kotlin-npm-tooling
            ~/.cache/yarn
          key: wasm-npm-${{ hashFiles('gradle/libs.versions.toml', 'kotlin-js-store/wasm/yarn.lock') }}
      - name: Restore Chrome
        id: chrome
        uses: actions/cache@v4
        with:
          path: ~/chrome-for-testing
          key: chrome-for-testing-${{ env.CHROME_VERSION }}
      # Only when the cache has no copy. curl's retries are printed; the hash decides.
      - name: Download Chrome
        if: steps.chrome.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/chrome.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
          echo "$CHROME_SHA256  $RUNNER_TEMP/chrome.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/chrome.zip" -d ~/chrome-for-testing
      # Karma starts the browser named by CHROME_BIN. Started once here, so a browser that cannot run fails
      # in this step and says so, not as a test failure.
      - name: Versions
        run: |
          chrome=$HOME/chrome-for-testing/chrome-linux64/chrome
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          echo "YARN_CACHE_FOLDER=$HOME/.cache/yarn" >> "$GITHUB_ENV"
          "$chrome" --version
          "$chrome" --headless --disable-gpu --dump-dom about:blank > /dev/null
          ./gradlew --version
      - name: Test
        run: ./gradlew :shared:allTests :server:test :server:verifyMainDatabaseMigration :composeApp:allTests --profile
      # The browser tests can fail with a bare "Error"; the reports hold what the console said.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          retention-days: 7
      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-test
          path: build/reports/profile/

  # The debug APK and lint. Release APKs are built by the Release workflow.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Versions
        run: ./gradlew --version
      # testDebugUnitTest starts the real MainActivity under Robolectric (AppStartTest): an app that cannot start fails here.
      - name: Build, start and lint
        run: ./gradlew :androidApp:assembleDebug :androidApp:testDebugUnitTest :androidApp:lintDebug --profile
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: androidApp/build/outputs/apk/debug/androidApp-debug.apk
      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-android
          path: build/reports/profile/

  # Screenshot tests: the screens rendered on the JVM (Robolectric), compared with the pictures in
  # composeApp/src/androidHostTest/screenshots. A separate job, so the test job doesn't get longer.
  # When a picture differs, the artifact holds the new picture and a reference | difference | new image.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Versions
        run: ./gradlew --version
      - name: Compare screenshots
        run: ./gradlew :composeApp:verifyScreenshots --profile
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-differences
          path: composeApp/build/outputs/roborazzi/
      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-screenshots
          path: build/reports/profile/

  # The server jar with the web client (Wasm production build) inside.
  server-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags: the jar says which v* tag it was built after (GET /health).
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # As in the test job: the Wasm build's npm packages without the registry.
      - name: Restore the npm packages of the Wasm build
        uses: actions/cache@v4
        with:
          path: |
            ~/.kotlin/kotlin-npm-tooling
            ~/.cache/yarn
          key: wasm-npm-${{ hashFiles('gradle/libs.versions.toml', 'kotlin-js-store/wasm/yarn.lock') }}
      - name: Versions
        run: |
          echo "YARN_CACHE_FOLDER=$HOME/.cache/yarn" >> "$GITHUB_ENV"
          ./gradlew --version
      - name: Build the server jar
        run: ./gradlew :server:shadowJar --profile
      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: server/build/libs/server-all.jar
          retention-days: 3
      - name: Upload build profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-server-jar
          path: build/reports/profile/

  # The self-tests of the helper scripts for agents (scripts/agent-cost, scripts/code-map): plain Python
  # on made-up input, no Gradle, no secrets. A script that breaks fails here and not in the next session.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-tests of the agent scripts
        run: |
          scripts/agent-cost --self-test
          scripts/code-map --self-test
      # The helpers for the emulator (scripts/emulator): plain Python on made-up input; the clock shim's
      # test builds a small C library and skips itself without gcc (ubuntu-latest has it).
      - name: Self-tests of the emulator helpers
        run: |
          python3 -I scripts/emulator/screen.py --self-test
          python3 -I scripts/emulator/seed-recipes.py --self-test
          scripts/emulator/with-clock.sh --self-test

  # The server image: built and started on every run, so what only shows at start is found before the
  # merge and not the morning after; pushed only on main. Same registry and secrets as the cooking
  # site. The homelab is amd64 only.
  image:
    needs: [test, android, screenshots, server-jar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: server-jar
          path: server/build/libs
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: kick1999/mealplanner:${{ github.sha }}
      # No stores and no login provider: the server must still start and serve its health and the web client.
      - name: Start the image
        run: |
          docker run -d --name mealplanner -p 8080:8080 \
            -e MEALPLANNER_FETCH_OFFERS=off -e MEALPLANNER_DB_URL=jdbc:sqlite:/data/mealplanner.db \
            kick1999/mealplanner:${{ github.sha }}
      - name: Wait for it to report this commit
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health | tee health.json | grep -q "\"commit\":\"${GITHUB_SHA}\""; then
              cat health.json; exit 0
            fi
            sleep 1
          done
          echo "No /health with commit ${GITHUB_SHA} within 60 seconds"
          docker logs mealplanner
          exit 1
      - name: Check the web client and the data check
        run: |
          curl -fsS http://localhost:8080/ | grep -qi "<html" || { echo "/ does not serve the web client's page"; docker logs mealplanner; exit 1; }
          curl -fsS http://localhost:8080/health/data
      - name: Stop the image
        if: always()
        run: docker rm -f mealplanner
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # The very image that was started, not a second build.
      - name: Push the image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag kick1999/mealplanner:${{ github.sha }} kick1999/mealplanner:latest
          docker push kick1999/mealplanner:${{ github.sha }}
          docker push kick1999/mealplanner:latest
