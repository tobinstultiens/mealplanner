# The Kotlin/Wasm production link needs more than 2 GB; the compiler gets its own heap so it
# doesn't share the Gradle daemon's (CI runners have 16 GB).
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true

# The version the server reports when its build cannot read a v* tag (a shallow checkout); a tag wins. See server/build.gradle.kts.
mealplanner.version=0.1.0
